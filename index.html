<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Number Guessing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container game">

        <h1 class="d-flex justify-content-center">Number Guessing Game</h1>

        <p class="d-flex justify-content-center"><b>Guess a number between 1 to 100</b></p>

        <input type="number" id="inputNum" placeholder="Enter your guess" min="1" max="100">

        <button onclick="checkNumber()" id="btnSubmit">
            Submit Guess
        </button>

        <p id="feedback"></p>

        <p>
            Attempts:
            <strong id="attempt">0</strong>
        </p>

        <p>Previous Guesses:</p>

        <p id="previous">No guesses yet</p>

        <button onclick="newGame()" id="resetButton">
            New Game
        </button>

    </div>

    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
